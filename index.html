<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>Rando</title>
<style>
/* Layout: number centered in the upper area; "1 – [top]" and the mic sit low. No boxes, no lines. */
:root {
  --bg: #000;
  --fg: #f5f5f3;
  --dim: #6e6e73;
  --faint: #3a3a3c;
  --live: #ff453a;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--sans); margin: 0; padding-inline: 16px;
  -webkit-font-smoothing: antialiased;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing: border-box;
}
.app {
  height: 100%; max-width: 520px; margin: 0 auto;
  display: grid; grid-template-rows: 1fr auto; gap: 32px;
  padding-block: 32px; box-sizing: border-box;
}
.result {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; min-height: 0; text-align: center; cursor: pointer;
  -webkit-tap-highlight-color: transparent; user-select: none;
}
.num {
  font-weight: 200; line-height: 1; letter-spacing: -0.03em;
  font-size: clamp(96px, 34vw, 220px);
  font-variant-numeric: tabular-nums;
  max-width: 100%; overflow-wrap: anywhere;
  transition: opacity .12s;
}
.num.idle { color: var(--faint); }
.num.flash { opacity: .1; }
.range { display: none; }
.history {
  font-size: 14px; font-weight: 300; color: var(--dim); font-variant-numeric: tabular-nums;
  display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; min-height: 1.2em;
}
.controls { display: grid; gap: 20px; justify-items: center; }
.bounds {
  display: flex; align-items: baseline; justify-content: center; gap: 14px;
  font-size: 40px; font-weight: 200; font-variant-numeric: tabular-nums;
}
.one { color: var(--dim); }
.dash { color: var(--faint); }
input#max {
  font: inherit; color: var(--fg); background: transparent; border: 0; padding: 0; margin: 0;
  width: 1.2ch; min-width: 0; text-align: left; caret-color: var(--fg);
  -moz-appearance: textfield; appearance: textfield;
}
input#max::-webkit-outer-spin-button, input#max::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input#max::placeholder { color: var(--faint); }
input#max:focus { outline: none; }
#mic {
  background: none; border: 0; color: var(--dim); cursor: pointer;
  width: 56px; height: 56px; padding: 0; display: grid; place-items: center; border-radius: 50%;
  -webkit-tap-highlight-color: transparent;
}
#mic svg { width: 26px; height: 26px; }
#mic:hover { color: var(--fg); }
#mic.on { color: var(--live); animation: pulse 1.2s ease-in-out infinite; }
#mic:focus-visible { outline: 1px solid var(--dim); outline-offset: 2px; }
@keyframes pulse { 50% { opacity: .45; } }
.status { font-size: 12px; font-weight: 300; color: var(--dim); min-height: 1.3em; text-align: center; }
.status.err { color: var(--live); }
@media (prefers-reduced-motion: reduce) { #mic.on { animation: none; } .num { transition: none; } }
</style>
</head>
<body>
<main class="app">
  <section class="result" id="result" aria-live="polite" title="Tap to roll again">
    <div id="num" class="num idle">–</div>
    <div id="range" class="range"></div>
    <div id="history" class="history" aria-label="Previous results"></div>
  </section>

  <form id="form" class="controls" autocomplete="off">
    <div class="bounds">
      <span class="one" aria-label="From 1">1</span>
      <span class="dash" aria-hidden="true">–</span>
      <input id="max" type="number" min="1" step="1" enterkeyhint="go" placeholder="?" aria-label="Top number">
    </div>
    <button id="mic" type="button" aria-label="Speak a number">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <div id="status" class="status"></div>
  </form>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const numEl = $('num'), rangeEl = $('range'), histEl = $('history'),
        maxEl = $('max'), statusEl = $('status'), micBtn = $('mic');
  const history = [];
  const MAX_ALLOWED = Number.MAX_SAFE_INTEGER;

  // Unbiased uniform integer in [1, max] from the OS CSPRNG (crypto.getRandomValues) with rejection sampling.
  function secureRandomInt(max) {
    if (max === 1) return 1;
    if (max <= 0x100000000) {
      const range = max, limit = 0x100000000 - (0x100000000 % range);
      const buf = new Uint32Array(1);
      do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
      return (buf[0] % range) + 1;
    }
    // Up to 2^53: build a 53-bit value from two words, rejection-sample.
    const range = BigInt(max), space = 1n << 53n, limit = space - (space % range);
    const buf = new Uint32Array(2);
    let v;
    do {
      crypto.getRandomValues(buf);
      v = (BigInt(buf[0] & 0x1fffff) << 32n) | BigInt(buf[1]);
    } while (v >= limit);
    return Number(v % range) + 1;
  }

  function fmt(n) { return n.toLocaleString('en-US'); }

  function setStatus(msg, err) {
    statusEl.textContent = msg;
    statusEl.classList.toggle('err', !!err);
  }

  function parseBound(raw) {
    const s = String(raw).replace(/[,\s]/g, '');
    if (!/^\d+$/.test(s)) return null;
    const n = Number(s);
    if (!Number.isSafeInteger(n) || n < 1) return null;
    return n;
  }

  let speakNext = false;
  function roll() {
    const max = parseBound(maxEl.value);
    if (maxEl.value.trim() === '') { setStatus('Enter the top number first.', true); maxEl.focus(); return; }
    if (max === null) { setStatus('Top number must be a whole number, 1 or higher.', true); return; }
    if (max > MAX_ALLOWED) { setStatus('Top number is too large.', true); return; }
    const r = secureRandomInt(max);
    numEl.classList.remove('idle');
    numEl.classList.add('flash');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      numEl.textContent = fmt(r);
      numEl.classList.remove('flash');
    }));
    rangeEl.textContent = `1 – ${fmt(max)}`;
    history.unshift(r); if (history.length > 8) history.pop();
    histEl.textContent = '';
    history.slice(1).forEach(h => { const s = document.createElement('span'); s.textContent = fmt(h); histEl.appendChild(s); });
    setStatus('');
    if (speakNext && 'speechSynthesis' in window) {
      try { speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(String(r))); } catch (e) {}
    }
    speakNext = false;
  }

  $('form').addEventListener('submit', e => { e.preventDefault(); roll(); });
  maxEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); roll(); } });
  maxEl.addEventListener('input', () => { maxEl.style.width = Math.max(1.2, maxEl.value.length * 0.62 + 0.1) + 'em'; });
  $('result').addEventListener('click', () => { if (maxEl.value) roll(); else maxEl.focus(); });

  // ---- Voice ----
  const SMALL = { zero:0, oh:0, one:1, won:1, two:2, to:null, too:2, three:3, four:4, for:null, five:5, six:6, seven:7, eight:8, nine:9, ten:10,
    eleven:11, twelve:12, thirteen:13, fourteen:14, fifteen:15, sixteen:16, seventeen:17, eighteen:18, nineteen:19 };
  const TENS = { twenty:20, thirty:30, forty:40, fourty:40, fifty:50, sixty:60, seventy:70, eighty:80, ninety:90 };
  const SCALE = { hundred:100, thousand:1e3, million:1e6, billion:1e9, grand:1e3 };

  // Returns every number spoken in the phrase, in order. Handles digits ("1 to 50") and words ("one to fifty", "a hundred and twenty").
  function numbersIn(text) {
    const toks = text.toLowerCase().replace(/(\d),(\d)/g, '$1$2').replace(/-/g, ' ').match(/\d+(?:\.\d+)?k?|[a-z]+/g) || [];
    const out = [];
    let total = 0, cur = 0, active = false;
    const flush = () => { if (active) out.push(total + cur); total = 0; cur = 0; active = false; };
    for (let i = 0; i < toks.length; i++) {
      const t = toks[i];
      if (/^\d/.test(t)) {
        flush();
        let n = parseFloat(t); if (t.endsWith('k')) n *= 1000;
        cur = Math.round(n); active = true;
        if (!(toks[i+1] in SCALE)) flush();
        continue;
      }
      if (t === 'a' && (SCALE[toks[i+1]] )) { cur = 1; active = true; continue; }
      if (t === 'and' && active) continue;
      if (t in SMALL && SMALL[t] !== null) {
        if (active && cur % 10 === 0 && cur % 100 !== 0 && SMALL[t] < 10 && cur !== 0) { cur += SMALL[t]; }
        else if (active && cur === 0 && total > 0) { cur = SMALL[t]; }
        else if (active) { flush(); cur = SMALL[t]; active = true; }
        else { cur = SMALL[t]; active = true; }
        continue;
      }
      if (t in TENS) {
        if (active && (cur % 100 !== 0 || (cur === 0 && total === 0))) { if (cur !== 0) { flush(); } }
        cur += TENS[t]; active = true; continue;
      }
      if (t in SCALE) {
        if (!active) { cur = 1; active = true; }
        if (SCALE[t] === 100) cur = (cur || 1) * 100;
        else { total += (cur || 1) * SCALE[t]; cur = 0; }
        continue;
      }
      flush();
    }
    flush();
    return out;
  }

  const AGAIN = /\b(again|re ?roll|another|one more|repeat|roll|go|next)\b/;
  function handleSpeech(transcript) {
    const nums = numbersIn(transcript).filter(n => n >= 1);
    speakNext = true;
    if (nums.length) {
      maxEl.value = String(nums[nums.length - 1]);
      roll();
      setStatus(`Heard “${transcript}”`);
    } else if (AGAIN.test(transcript.toLowerCase()) && maxEl.value) {
      roll();
      setStatus(`Heard “${transcript}”`);
    } else {
      speakNext = false;
      setStatus(`Heard “${transcript}” — no number in it. Try “fifty” or “one to fifty”.`, true);
    }
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false;
  if (SR) {
    rec = new SR();
    rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 1; rec.continuous = false;
    rec.onresult = e => { const t = e.results[0][0].transcript.trim(); handleSpeech(t); };
    rec.onerror = e => {
      const m = {
        'not-allowed': 'Microphone access is blocked here. Allow the mic for this page, or type the number.',
        'service-not-allowed': 'Speech recognition is blocked here. Type the number instead.',
        'no-speech': 'Nothing heard. Tap the mic and try again.',
        'audio-capture': 'No microphone found.',
        'network': 'Speech recognition needs a network connection.'
      }[e.error] || `Voice error: ${e.error}`;
      setStatus(m, true);
    };
    rec.onend = () => { listening = false; micBtn.classList.remove('on'); };
  }

  micBtn.addEventListener('click', () => {
    if (!rec) { setStatus('Voice input isn’t supported in this browser. Use Chrome or Safari, or type the number.', true); return; }
    if (listening) { rec.stop(); return; }
    try {
      rec.start(); listening = true; micBtn.classList.add('on'); setStatus('Listening…');
    } catch (e) { setStatus('Could not start the microphone. Type the number instead.', true); }
  });

  // Keyboard: Enter rolls from anywhere; "M" toggles mic when not typing.
  document.addEventListener('keydown', e => {
    if (e.target === maxEl) return;
    if (e.key === 'Enter') { e.preventDefault(); roll(); }
    else if (e.key.toLowerCase() === 'm') micBtn.click();
  });

  window.__rando = { numbersIn, secureRandomInt };
})();
</script>

</body>
</html>
